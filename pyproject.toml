[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jevcomp"
version = "0.1.0"
description = "Agent-universal context compaction via TypeSafe Jev: deletion instead of lossy summaries, everything kept stays verbatim. Python CLI + Claude Code function-hook plugin."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "liqunqun07" }]
requires-python = ">=3.9"
keywords = ["claude-code", "zcode", "codex", "compaction", "context-window", "jev", "typesafe", "agents"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Pre-processors",
]

[project.scripts]
jevcomp = "jevcomp.cli:main"

[tool.setuptools]
packages = ["jevcomp", "jevcomp.adapters"]
